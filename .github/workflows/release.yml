name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win -- -p never
          - os: macos-latest
            build_cmd: npm run build:mac -- -p never
          - os: ubuntu-latest
            build_cmd: npm run build:linux -- -p never

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps (with retry on Windows EPERM flakes)
        shell: bash
        run: |
          npm ci || (echo "npm ci failed, retrying once..." && rm -rf node_modules && npm ci)
      - name: Build native scanner
        shell: bash
        run: |
          cd native-scanner
          npm ci || (echo "native-scanner npm ci failed, retrying once..." && rm -rf node_modules && npm ci)
          npm run build
      - run: ${{ matrix.build_cmd }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest.yml
            dist/latest-mac.yml
            dist/latest-linux.yml
            dist/*.blockmap
